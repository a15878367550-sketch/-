<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫伟 (末小空) - 文学作品集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #f9fafb; }
        .lightbox { display: none; }
        .lightbox.active { display: flex; }
    </style>
</head>
<body class="text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-sm py-16 text-center border-b border-gray-200">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-wide">莫伟 <span class="text-gray-400 font-normal text-2xl">(末小空)</span></h1>
        <p class="text-xl text-gray-500 font-light">文学创作与获奖作品集</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards injected via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-gray-400 text-sm">
        <p>© 2026 莫伟. All Rights Reserved.</p>
    </footer>

    <!-- Lightbox (Image Viewer) -->
    <div id="lightbox" class="lightbox fixed inset-0 z-50 bg-black/95 items-center justify-center p-4 backdrop-blur-sm">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white text-5xl hover:text-gray-400 transition-colors">&times;</button>
        <div id="lightbox-content" class="w-full max-w-5xl h-full flex flex-col items-center overflow-y-auto pt-16 pb-8 space-y-6 scroll-smooth">
            <!-- Images injected via JS -->
        </div>
    </div>

    <script>
        const data = [
          {"id": 1, "title": "入选广西文学院2026年青年班", "type": "获奖证明", "images": ["01_guangxi.jpg"], "description": "广西文学院第二十二期广西青年文学讲习班邀请函"},
          {"id": 2, "title": "小说《不洁之痒》", "type": "文学发表", "images": ["02_tangshan_1.jpg", "02_tangshan_2.jpg"], "description": "发表于《唐山文学》2026.3期"},
          {"id": 3, "title": "小说《白夜之渡》", "type": "核心期刊发表", "images": ["03_qingming_1.jpg", "03_qingming_2.jpg"], "description": "发表于《清明》（中文核心期刊）"},
          {"id": 4, "title": "鲲鹏科幻文学奖二等奖", "type": "获奖证明", "images": ["04_kunpeng.jpg"], "description": "作品《俱芦洲》。最高颁发单位：中国大百科全书出版社"},
          {"id": 5, "title": "刘慈欣科幻征文优秀作品", "type": "获奖证明", "images": ["05_liucixin.jpg"], "description": "作品《修剪地球》。最高颁发单位：山西省作家协会"},
          {"id": 6, "title": "小百花儿童文学奖", "type": "获奖证明", "images": ["06_xiaobaihua.jpg"], "description": "作品《云朵橡皮擦》。最高颁发单位：上海市作家协会"}
        ];

        const grid = document.getElementById('portfolio-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightbox-content');

        function renderCards() {
            data.forEach(item => {
                // Different styles for different types of achievements
                const badgeColor = item.type === '核心期刊发表' ? 'bg-red-50 text-red-700 border-red-200' :
                                   item.type === '文学发表' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                   'bg-amber-50 text-amber-700 border-amber-200';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col group';
                card.onclick = () => openLightbox(item.id);

                card.innerHTML = `
                    <div class="h-64 overflow-hidden bg-gray-50 border-b border-gray-100 relative">
                        <img src="${item.images[0]}" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-700" alt="${item.title}">
                        ${item.images.length > 1 ? `<span class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-lg">共 ${item.images.length} 页</span>` : ''}
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <div class="mb-4">
                            <span class="inline-block px-3 py-1 text-xs font-semibold rounded-full border ${badgeColor}">${item.type}</span>
                        </div>
                        <h2 class="text-xl font-bold mb-3 text-gray-900 group-hover:text-blue-600 transition-colors">${item.title}</h2>
                        <p class="text-gray-500 text-sm mt-auto leading-relaxed">${item.description}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openLightbox(id) {
            const item = data.find(i => i.id === id);
            lightboxContent.innerHTML = '';
            item.images.forEach(imgSrc => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'w-auto max-w-full lg:max-w-4xl shadow-2xl rounded-sm object-contain';
                lightboxContent.appendChild(img);
            });
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close lightbox on click outside the image
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox || e.target === lightboxContent) {
                closeLightbox();
            }
        });

        // Close on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        // Initialize
        renderCards();
    </script>
</body>
</html>
